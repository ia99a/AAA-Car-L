<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<!-- لا سكربتات إلا من ملفات الصفحة نفسها، والصور (البلاطات) من CARTO أو Esri فقط -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.basemaps.cartocdn.com https://server.arcgisonline.com;">
<meta name="referrer" content="origin">
<link rel="stylesheet" href="leaflet.css">
<style>
  html,body,#map{margin:0;height:100%;background:#191b1f}
  .leaflet-container{background:#191b1f}
  .leaflet-control-attribution{background:rgba(22,24,28,.7)!important;color:#737a84!important;font:10px sans-serif}
  .leaflet-control-attribution a{color:#a0a6af!important}
  .me{width:30px;height:30px;transition:transform .6s linear}
  .hz{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 3px rgba(0,0,0,.35)}
  .hz svg{width:14px;height:14px;fill:#fff}
  .cam{background:#e5534b}
  .bump{background:#eba53c}
  .mini .leaflet-control-attribution{font-size:7px;padding:0 3px}
  .light #meArrow path{fill:#1a73e8;stroke:#ffffff}
  .mini.light, .mini.light body, .mini.light #map, .mini.light .leaflet-container{background:#e9e5dc}
  .mini.light .leaflet-control-attribution{background:rgba(255,255,255,.7)!important;color:#555!important}
</style>
</head>
<body>
<div id="map"></div>
<script src="leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
