plugins {
    id 'com.android.application'
}

android {
    namespace 'com.santafe.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.santafe.launcher'
        minSdk 24          // أندرويد ٧ فما فوق، يغطي شاشات السيارات الشائعة
        targetSdk 34
        versionCode 7
        versionName '1.6'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
